name: publish

on: 
  push:
    branches:
      - publish
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --property:Version=${{ github.ref_name }}
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Publish
      run: |
        for pkg in ./dist/debug/*.nupkg; do
          dotnet nuget push "$pkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate
        done
